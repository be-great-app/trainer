<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренування">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Тренування</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
<style>
:root{--bg:#000;--ink:#f6ede8;--mut:#a8958c;--faint:rgba(255,225,210,.12);--line:rgba(255,190,165,.12);--card:#17110f;--chip:rgba(255,240,232,.07);--acc:#f0623a;--acc-t:rgba(240,98,58,.16);--gold:#ffa078;--gold-t:rgba(255,160,120,.13);--ok:#ffb28c;--ok-t:rgba(255,178,140,.12);--warn:#ffa078;--grad:linear-gradient(90deg,#c22d0c,#f2734a);--r:18px;--serif:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sans:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
*{font-variant-numeric:lining-nums !important}
.cnt,table,#timer .t,.stp input{font-variant-numeric:lining-nums tabular-nums !important}
body{margin:0;min-height:100vh;color:var(--ink);font:14.08px/1.45 var(--sans);background:#000}

body::after{content:"";position:fixed;left:8%;right:8%;bottom:34px;height:120px;background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(214,62,18,.55),rgba(214,62,18,.15) 55%,transparent 80%);pointer-events:none;z-index:0}
.glow{position:absolute;left:-16px;top:0;width:78%;height:210px;background:radial-gradient(ellipse 72% 100% at 34% 0%,rgba(196,56,18,.85),rgba(150,38,10,.42) 42%,rgba(90,22,6,.12) 70%,transparent 86%);pointer-events:none;z-index:-1}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
main,header,nav,#timer,#toast{position:relative;z-index:1}
/* шапка */
header{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 0 0;background:#000;box-shadow:0 10px 18px #000}
.topline{height:2px;width:62%;background:linear-gradient(90deg,#e2501f,rgba(226,80,31,0))}
.hrow{display:flex;align-items:center;gap:2px;padding:14px 10px 14px 16px;max-width:560px;margin:0 auto}
.htl{flex:1;min-width:0;border-left:1.2px solid var(--ink);padding-left:7px}
header h1{margin:0;font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
#sync{display:block;font-size:8px;letter-spacing:.05em;color:var(--mut);margin-top:1px}#sync.warn{color:var(--gold)}
.ic{display:grid;place-items:center;width:36px;height:36px;color:var(--ink)}.ic svg{width:17px;height:17px}
.ic[hidden],#back[hidden]{display:none}
.hsep{width:1px;height:18px;background:var(--mut);opacity:.6}
#back{border:0;background:none;color:var(--ink);font-size:30px;line-height:1;width:34px;height:40px;padding:0 0 4px;margin-left:-8px}
main{position:relative;padding:4px 16px 120px;max-width:560px;margin:0 auto;isolation:isolate}
/* нижнє меню */
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#000;padding:0 8px env(safe-area-inset-bottom)}
nav#tabs::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:rgba(255,190,165,.14)}
nav#tabs a{flex:1;text-align:center;padding:15px 2px 14px;font-size:9px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);opacity:.85;position:relative}
nav#tabs a.on{color:var(--acc);font-weight:700;opacity:1}
nav#tabs a.on::before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:3px;border-radius:0 0 2px 2px;background:var(--grad)}
/* тиждень */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:20px -6px 4px}
.wd{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:20px;padding:4px 0 8px;min-width:0;position:relative}
.wn{font-size:9px;letter-spacing:.04em;color:var(--ink);opacity:.8;font-weight:700;padding:2px 6px;border:1.2px solid transparent;border-radius:5px;line-height:1.2}
.wd.tr .wn{color:var(--acc);opacity:1}
.wd.today .wn{border-color:#ffc9b3;color:#ffc9b3;opacity:1}
.wc{position:relative;font:300 22px/1 var(--serif);color:var(--ink);opacity:.9}
.wd.tr .wc{color:var(--acc);opacity:1}
.wdi{position:absolute;right:-15px;top:-6px;width:13px;height:9px;color:var(--acc)}
.wdot{position:absolute;right:-8px;top:-5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.wd.sel::after{content:"";position:absolute;bottom:-3px;width:22px;height:2px;border-radius:2px;background:var(--acc)}
/* куля */
.ring{width:78%;max-width:340px;margin:30px auto 8px}.ring svg{display:block;width:100%;height:auto;overflow:visible}
.rg,.rc{cursor:pointer}
.rl{font:400 11.5px var(--sans);letter-spacing:.02em;fill:var(--ink);opacity:.85}.rl.on{fill:#fff;opacity:1;font-weight:600}.rl.fin{fill:var(--gold);opacity:.9}
.rk{font:400 18.6px var(--serif);fill:#1c0702;letter-spacing:.01em}
.rs{font:500 14.3px var(--sans);fill:#1c0702}
.cta{display:block;width:190px;margin:4px auto 26px;padding:5px 10px 4px;text-align:center;border-radius:999px;background:var(--grad);color:#1c0702;font-size:11.5px;font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:1.35}
/* секції */
.sec{margin:26px 2px 12px;padding-left:7px;border-left:1.2px solid var(--ink);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
/* вправи дня смугами */
.exbs{display:grid;gap:9px;margin-bottom:6px;padding-left:10px}
.exb{position:relative;display:grid;grid-template-columns:1fr auto 22px;align-items:center;gap:10px;height:25px;padding:0 6px 0 10px;border-radius:999px;background:rgba(255,240,232,.03);overflow:hidden;isolation:isolate}
.exb::before{content:"";position:absolute;inset:0;width:var(--p);background:linear-gradient(90deg,rgba(0,0,0,0) 10%,rgba(194,45,12,.55) 55%,#f2734a);border-radius:inherit;z-index:-1}
.exb.fin::before{width:100%}
.exb.cur{box-shadow:inset 0 0 0 1.5px var(--acc)}
.exbn{font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exbn em{font-style:normal;font-size:7.5px;font-weight:700;color:var(--gold);border:1px solid rgba(255,160,120,.5);border-radius:4px;padding:0 3px;margin-right:6px;vertical-align:1px}
.exbc{font:700 14.5px var(--sans);letter-spacing:.14em}
.exbk{font-size:18px;font-weight:800;text-align:center}
.exb:not(.fin) .exbk{color:var(--mut);font-weight:400}
/* три картки */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 6px}
.tcard{border-radius:16px;padding:13px 11px;min-height:150px;display:block;color:var(--ink);border:1px solid var(--line)}
.tcard h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tcard p{margin:0;font-size:12.5px;line-height:1.5;overflow-wrap:break-word}
.tcard b{display:block;margin-top:6px;font-weight:700}
.tcard .muted{font-size:11px}
.t1{background:linear-gradient(160deg,rgba(242,115,74,.45),rgba(194,45,12,.12));border-color:rgba(242,115,74,.55)}.t1 h4{color:#ffd2bf}
.t2{background:var(--card)}.t2 h4{color:var(--mut)}
.t3{background:linear-gradient(160deg,rgba(255,160,120,.16),rgba(255,160,120,.03));border-color:rgba(255,160,120,.35)}.t3 h4{color:var(--gold)}
/* плитки тижня */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:8px}
.tiles div{background:#2b2321;border-radius:7px;padding:9px 11px 8px;min-height:47px}
.tiles b{display:block;font:300 21px/1 var(--serif);color:#e9ddd7}.tiles span{display:block;margin-top:3px;font-size:9.5px;color:#cbbab2}
/* тіло */
.bday{display:block}.bdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.bdh b{font:300 20px var(--serif)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:11px;padding:5px 10px;border-radius:99px;background:var(--acc-t);color:#ffcab4;border:1px solid rgba(240,98,58,.3)}
.card.tolink{display:flex;flex-direction:column;gap:3px}.tolink b{font-size:13.5px}
.gcard{border:1.5px solid var(--gold);border-radius:var(--r);padding:18px;margin:14px 0 10px;background:var(--gold-t)}
.gk{font:italic 400 16px var(--serif);color:var(--gold)}
.gcard h3{margin:8px 0;font-size:18px;font-weight:500;line-height:1.25}.gcard p{margin:0 0 8px;color:var(--mut)}
/* загальне */
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 10px}
.muted{color:var(--mut);font-size:12.32px}
.wk{margin:22px 2px 12px;padding-left:9px;border-left:1.5px solid var(--ink);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.day{display:flex;align-items:center;gap:12px}
.day>div{flex:1;min-width:0}
.day b{font:400 18.92px/1.2 var(--serif)}
.day.cur{border-color:rgba(255,160,120,.7);box-shadow:0 0 22px rgba(255,160,120,.12)}
.badge{font-size:10.56px;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--mut);white-space:nowrap}
.done .badge{background:var(--ok-t);color:var(--ok)}
.progress .badge{background:var(--acc-t);color:var(--acc)}
.ex{display:flex;align-items:center;gap:10px;padding:11px 0}
.ex+.ex{border-top:1px solid var(--line)}
.ex>div{flex:1;min-width:0}
.cnt{font-variant-numeric:lining-nums tabular-nums;font-size:12.32px;padding:4px 11px;border-radius:99px;background:var(--chip)}
.cnt.full{background:var(--ok-t);color:var(--ok)}
.sslbl{font-size:9.68px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.16em}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:999px;padding:14px;font-size:13.2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,#c22d0c,#f2734a);color:#2b0b02;margin:10px 0;box-shadow:0 6px 22px rgba(226,80,31,.25)}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2a1007;box-shadow:0 6px 22px rgba(255,160,120,.2)}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:12.32px;margin:4px 6px 4px 0}
.big{font:300 28.6px/1.1 var(--serif)}
.vid{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--acc-t);color:var(--acc);font-size:12.32px;font-weight:600}
details{margin-top:10px}summary{color:var(--gold);font-size:12.32px}
details p{margin:6px 0 0;font-size:13.2px}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin:0 0 8px;display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center}
.set.saved{border-color:rgba(255,178,140,.6);background:linear-gradient(var(--ok-t),var(--ok-t)),var(--card)}
.set.dirty{border-color:var(--acc)}
.set.wu .sl{color:var(--mut)}
.sl{font:400 17.6px var(--serif);text-align:center}
.stp{display:flex;align-items:center;background:var(--chip);border-radius:12px;min-width:0}
.stp button{border:0;background:none;color:var(--ink);width:38px;height:46px;font-size:19.36px;flex:none}
.stp input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--ink);text-align:center;font:300 21.56px var(--serif);padding:0}
.stp input:focus{outline:none}
.vtag{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--acc-t);color:var(--acc);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.vtag svg{width:17px;height:17px;flex:none}
.set.vidset{border-color:rgba(240,98,58,.75);box-shadow:inset 0 0 0 1px rgba(240,98,58,.3)}
.set.vidset.saved{border-color:rgba(255,178,140,.6);box-shadow:none}
.set.vidset.saved .vtag{background:var(--chip);color:var(--mut)}
.pl{grid-column:1/4;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--mut);padding:2px 2px 0}
.pl:empty{display:none}
.plate{display:inline-grid;place-items:center;min-width:30px;padding:0 6px;border-radius:7px;background:var(--gold-t);border:1px solid rgba(255,160,120,.45);color:var(--gold);font-weight:700;font-size:11px}
.pd{margin-left:auto;color:var(--ink);font-weight:600;white-space:nowrap}
.pd.dn{color:var(--mut)}
.bars{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.bars span{font-size:11.44px;color:var(--mut);margin-right:2px}
.bars button,.plch button{height:36px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--chip);color:var(--ink);font-weight:600;font-size:12.32px}
.bars button.on,.plch button.on{background:var(--gold);color:#2a1007;border-color:var(--gold)}
.plch{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rir.nor{min-height:40px;align-items:center}.rir.nor span{font-size:10.56px;letter-spacing:.02em;margin:0 0 0 4px}
.cnote{margin-top:12px;padding:11px 13px;border-radius:14px;border:1px solid rgba(255,160,120,.45);background:var(--gold-t)}
.cnote b{display:block;color:var(--gold);font-size:10.12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.cnote p{margin:0;font-size:13.2px;line-height:1.5}
.sxn{grid-column:1/4;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:-2px 0 -2px 2px}
.sxl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.rh{margin:18px 4px 8px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.unit{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:-6px;font-size:9.68px;color:var(--mut);text-align:center;letter-spacing:.05em}
.row2{grid-column:1/4;display:flex;gap:6px;align-items:center}
.rir{display:flex;gap:4px;flex:1}
.rir span{font-size:9.68px;color:var(--mut);align-self:center;margin-right:2px;letter-spacing:.08em}
.rir button{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:var(--chip);color:var(--ink);font-size:13.2px;font-weight:600}
.rir button.on{background:var(--acc);color:#fff}
.ok{flex:none;width:52px;height:40px;border:0;border-radius:10px;background:var(--chip);color:var(--mut);font-size:17.6px;font-weight:700}
.set:not(.saved) .ok{background:none;color:var(--acc);box-shadow:inset 0 0 0 1.5px rgba(240,98,58,.55)}
.set.dirty .ok{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(240,98,58,.35)}
.set.saved:not(.dirty) .ok{background:var(--ok);color:#2a1007}
.del{flex:none;width:34px;height:40px;border:0;border-radius:10px;background:none;color:var(--mut);font-size:17.6px}
label{display:block;font-size:11.44px;color:var(--mut);margin:14px 0 5px}
input.f,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);font:inherit}
input.f:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{min-height:76px;resize:vertical}
.navx{display:flex;gap:8px}.navx a{flex:1}
.wb{display:flex;gap:6px}.wb button{flex:1;height:50px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:400 18.92px var(--serif)}
.wb button.on{background:var(--acc);color:#fff}
pre.rep{white-space:pre-wrap;font:11.88px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.22);border:1px solid var(--line);padding:12px;border-radius:14px;margin:10px 0}
.banner{background:var(--gold-t);color:var(--gold);padding:10px 14px;border-radius:14px;font-size:12.32px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.32px;font-variant-numeric:lining-nums tabular-nums}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:10.56px}
.chart{position:relative;height:200px;margin:8px 0 4px}.chart.sm{height:150px}
.mot{border-radius:16px;padding:8px 14px 4px;margin:0 0 6px;border:1px solid rgba(240,98,58,.35);background:linear-gradient(160deg,rgba(194,45,12,.28),rgba(23,17,15,.9) 70%)}
.mk{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.mi{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start;padding:7px 0}.mi+.mi{border-top:1px solid var(--line)}
.md{width:10px;height:10px;border-radius:50%;margin-top:4px;box-shadow:0 0 10px currentColor}.mi b{display:block;font-size:14px;font-weight:600}.mi span{font-size:12px;color:var(--mut)}
.why{display:flex;gap:8px;margin:8px 0 2px;font-size:13px;line-height:1.45;color:var(--ink)}.why span{color:var(--gold)}
.restm{margin:10px 4px 12px;text-align:center;font-size:12.5px;color:var(--mut)}
.gbar small{display:block;font-size:10px;color:var(--mut);margin-top:1px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center}
.st b{display:block;font:300 28px/1.1 var(--serif)}.st span{display:block;margin-top:4px;font-size:10.5px;line-height:1.35;color:var(--mut)}
.st.gold{border-color:rgba(255,160,120,.5);background:linear-gradient(180deg,var(--gold-t),transparent)}.st.gold b{color:var(--gold)}
.wsel{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}.wsel::-webkit-scrollbar{display:none}
.wsel button{flex:none;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--chip);color:var(--ink);font:600 12px var(--sans)}
.wsel button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.adh{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}.adr{width:96px;height:96px;display:block}
.adt{font:300 19px var(--serif);fill:var(--ink)}.adl h4,.ch{margin:0 0 4px;font-size:13.5px;font-weight:600}.adl p{margin:0 0 8px}
.adb,.gbar{display:grid;grid-template-columns:44px 1fr 38px;gap:8px;align-items:center;font-size:11px;color:var(--mut);margin-top:5px}
.gbar{grid-template-columns:128px 1fr 34px;font-size:11.5px}.gbar span:first-child{color:var(--ink)}.adb span:last-child,.gbar span:last-child{text-align:right}
.adb i,.gbar i{height:6px;border-radius:3px;background:var(--faint);overflow:hidden}.adb b,.gbar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--gold))}
.body{display:block;width:100%;max-width:300px;margin:6px auto 8px}.bl{font:500 10px var(--sans);fill:var(--mut);letter-spacing:.08em}
.prr,.exr{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:10px 0}.exr{grid-template-columns:1fr 84px 64px}
.prr+.prr,.exr+.exr{border-top:1px solid var(--line)}.prr b,.exn{font-size:13px;font-weight:600}.exn .muted{font-weight:400;font-size:11px}.prr .muted{font-size:11px}
.star{color:var(--gold)}.prv,.exv{text-align:right;font:300 19px/1.1 var(--serif);white-space:nowrap}.prv small,.exv small{display:block;font:400 10px var(--sans);color:var(--mut)}
.exv small{display:inline;margin-left:3px}.exv em{display:block;font:600 11px var(--sans);font-style:normal}.spk{width:84px;height:30px;display:block}
.prow{display:flex;justify-content:space-between;gap:10px;padding:11px 0}
.prow+.prow{border-top:1px solid var(--line)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--warn);font-weight:600}
#timer{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:7;max-width:536px;margin:0 auto;background:rgba(20,12,9,.96);border:1px solid rgba(255,160,120,.4);color:var(--ink);border-radius:20px;padding:10px 12px 12px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 34px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#timer[hidden]{display:none}
#timer .t{flex:1;min-width:0;font:300 29.92px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
#timer .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 9.24px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
#timer button{border:0;border-radius:12px;height:42px;padding:0 13px;background:var(--chip);color:inherit;font-size:13.2px;font-weight:600}
#timer.end{background:var(--acc);color:#fff;border-color:transparent}#timer.end small{color:#fff}
#bar{position:absolute;left:16px;right:16px;bottom:5px;height:3px;border-radius:2px;background:var(--gold);opacity:.6;transform-origin:left}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;background:#fff1ea;color:#2a1007;padding:10px 16px;border-radius:14px;font-size:12.32px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.ro td:last-child{color:var(--mut)}
</style>

<body>
<header><div class="topline"></div><div class="hrow"><button id="back" hidden aria-label="Назад">‹</button><div class="htl"><h1 id="title">Сьогодні</h1><span id="sync"></span></div><a id="gear" class="ic" href="#/settings" aria-label="Налаштування"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg></a><i class="hsep"></i><a id="cal" class="ic" href="#/program" aria-label="Уся програма"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8.2 3v4M15.8 3v4"/></svg></a></div></header>
<main id="app"></main>
<div id="timer" hidden><div class="t"><small>Відпочинок</small><span id="tleft">0:00</span></div><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="x">✕</button><div id="bar"></div></div>
<nav id="tabs"><a href="#/" data-tab="today">Сьогодні</a><a href="#/program" data-tab="program">Програма</a><a href="#/progress" data-tab="progress">Прогрес</a><a href="#/body" data-tab="body">Тіло</a></nav>
<div id="toast"></div>
<script>
'use strict';
/* ================= утиліти ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.').trim()); return isFinite(n) ? n : null; };
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
const dkey = s => { const p = String(s).split('.'); return p.length === 3 ? p[2] + p[1] + p[0] : String(s); };
const nf = n => n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const fw = w => w == null ? 'власна вага' : `${nf(w)} кг`;
const rirTxt = r => r == null ? '' : (r >= 5 ? '5+' : String(r));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= демо-програма (тиждень 1) ================= */
const PH = ['week','date','day_no','order','superset','exercise','video','warmup','weight_kg','reps','sets','rest','notes'];
const DEMO = [
 [1,'02.11.2026',1,1,'','Болгарський спліт-присід','Останній','4x10',8,8,4,'2-3 хв','19 висота крючка, зверху перекладина. Постановка на довжину ноги, плавно опускаємося в сід, так щоб груди торкнулися стегна.'],
 [1,'02.11.2026',1,2,'','Ричажна горизонтальна тяга','','',10,10,3,'2 хв','Стільчик налаштувати так, щоб впиратися в подушку під грудьми, ручку беремо під нижню кромку. Слідкуємо за диханням: короткий видих на зусиллі, швидко вдих.'],
 [1,'02.11.2026',1,3,'','Сідничний міст','Останній','50x12',65,15,3,'3 хв','Слідкуй, щоб гриф був по центру; опускання 3-4 сек, підйом швидше.'],
 [1,'02.11.2026',1,4,'A','Відведення гант','Останній','',5,12,3,'1.5 хв','Лопатки опущені, піднімаємо не вище рівня плечей, лікоть завжди трішки зігнутий.'],
 [1,'02.11.2026',1,5,'A','Розведення сидячи','','',35,15,4,'1.5 хв','Плавний темп, зроби передній нахил тазу.'],
 [1,'02.11.2026',1,6,'','Прес на стійці','Останній','','',6,6,'','Всю спину притиснути до спинки, депресувати лопатки, зігнути коліна і цей кут не змінювати. З видихом підняти ноги якомога вище, без інерції.'],
 [1,'04.11.2026',2,1,'','Румунська тяга','Останній','30x10, 40x8, 50x8',55,8,3,'3 хв','Знімаємо зі стійок з рівною спиною, на вдиху. Плавно опускаємось, штовхаємо ногами підлогу і встаємо, без перерозгинання в попереку.'],
 [1,'04.11.2026',2,2,'','Жим гант сидячи','Перший і Останній','5x10',6,10,3,'2 хв','Спинка на -1 від вертикальної (тренер скине відео). Слідкуй за ліктями, щоб були трошки попереду тіла.'],
 [1,'04.11.2026',2,3,'','Жим ногами','Останній','10x10, 30x10',40,8,3,'2-3 хв','Плавний темп. Вага — яку покласти зверху, вагу тренажера не враховуємо.'],
 [1,'04.11.2026',2,4,'','Журавль','Останній','',10,10,3,'1-2 хв','Плавний темп'],
 [1,'04.11.2026',2,5,'A','Книжечки','','','',6,4,'','Ноги стартують на пів секунди раніше. У піковому скороченні повний видих, опора на верхню частину сідниць, руки торкаються носочків.'],
 [1,'04.11.2026',2,6,'A',"Повороти з м'ячем",'','',6,16,4,'','Плавно, видихаємо на зусиллі.'],
 [1,'06.11.2026',3,1,'','Вертикальна тяга (середня ручка)','Останній','25x10',30,10,4,'2-3 хв','Трішки відхиляємось назад, не прогинаючи спину. Тягнемо до ключиць, у верхній точці максимально розтягуємо лопатки, рух починаємо з їх приведення.'],
 [1,'06.11.2026',3,2,'','Жим гант (нахил спинки 45°)','Останній','6x10',7,12,3,'2 хв','Плавний темп, лікті напівпритиснуті.'],
 [1,'06.11.2026',3,3,'','TRX підтягування','Останній','','',6,3,'2 хв','Ноги рівно під місцем кріплення TRX, петлі приблизно на рівні живота, лопатки опущені, без ривків.'],
 [1,'06.11.2026',3,4,'','Лицева тяга','','',30,12,3,'1-1.5 хв','Плавний темп, без ривків, лопатки опущені весь час.'],
 [1,'06.11.2026',3,5,'','Екстензія','','',15,10,3,'','Плавно вниз, плавно вверх (налаштуй на 4 дірку).']
];

/* ================= стан ================= */
let S = Object.assign({ api: '', token: '', step: 2.5, demo: false, role: 'write', readToken: '', bars: {}, plates: [20, 15, 10, 5, 2.5, 1.25] }, store.get('settings', {}));
if (!S.bars || typeof S.bars !== 'object') S.bars = {};
if (!Array.isArray(S.plates) || !S.plates.length) S.plates = [20, 15, 10, 5, 2.5, 1.25];
let DB = Object.assign({ program: [], log: [], sessions: [] }, store.get('db', {}));
let Q = Object.assign({ sets: {}, sessions: {} }, store.get('queue', {}));
const saveS = () => store.set('settings', S), saveDB = () => store.set('db', DB), saveQ = () => store.set('queue', Q);
const coach = () => S.role === 'read';
const notesMap = {};   // коментар/відео вправи до першого збереженого підходу
const extra = {};      // додані вручну рядки підходів
let charts = [];

(function readUrl() {
  const q = new URLSearchParams(location.search);
  if (!q.get('api')) return;
  const wasDemo = S.demo;
  S.api = q.get('api'); S.token = q.get('token') || ''; S.demo = false;
  if (q.get('coach') === '1') S.role = 'read';
  if (wasDemo) { DB = { program: [], log: [], sessions: [] }; Q = { sets: {}, sessions: {} }; saveDB(); saveQ(); }
  saveS();
  history.replaceState(null, '', location.pathname + location.hash);
})();

/* ================= нормалізація ================= */
// Дата з таблиці може прийти як «02.11.2026», «2.11.2026» або ISO «2026-11-01T22:00:00.000Z» (UTC) — зводимо до дд.мм.рррр за місцевим часом.
function normDate(v) {
  const s = String(v ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) { const d = new Date(s); if (!isNaN(d)) return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; }
  const m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
  return m ? `${pad(m[1])}.${pad(m[2])}.${m[3]}` : s;
}
const normP = r => {
  const name = String(r.exercise ?? '').trim();
  if (!name) return null;
  return { week: +r.week || 1, date: normDate(r.date), day: +r.day_no || 1, order: +r.order || 0,
    ss: String(r.superset ?? '').trim(), name, video: String(r.video ?? '').trim(), warmup: String(r.warmup ?? '').trim(),
    w: num(r.weight_kg), bar: num(r.bar_kg), reps: num(r.reps), sets: num(r.sets) || 1, rest: String(r.rest ?? '').trim(), notes: String(r.notes ?? '').trim() };
};
const flag = v => (v === true || v === 1 || ['1', 'true', 'TRUE'].includes(String(v))) ? 1 : 0;
const normL = r => ({ id: String(r.id), saved_at: String(r.saved_at || ''), week: +r.week, date: normDate(r.date), day_no: +r.day_no,
  order: +r.order, exercise: String(r.exercise || ''), set_no: +r.set_no || 0, weight_kg: num(r.weight_kg), reps: num(r.reps),
  rir: num(r.rir), is_warmup: flag(r.is_warmup), comment: String(r.comment || ''), video_url: String(r.video_url || '') });
const normSess = r => ({ id: String(r.id), date: normDate(r.date), week: +r.week, day_no: +r.day_no, started_at: String(r.started_at || ''),
  finished_at: String(r.finished_at || ''), wellbeing_1_5: num(r.wellbeing_1_5), comment: String(r.comment || '') });
function mergeById(list, pend) {
  const m = new Map(list.map(x => [x.id, x]));
  for (const [id, v] of Object.entries(pend)) { if (v._delete) m.delete(id); else m.set(id, v); }
  return [...m.values()];
}

// Виправити дати в даних, збережених попередньою версією
DB.program = (DB.program || []).map(p => ({ ...p, date: normDate(p.date) }));
DB.log = (DB.log || []).map(x => ({ ...x, date: normDate(x.date) }));
DB.sessions = (DB.sessions || []).map(x => ({ ...x, date: normDate(x.date) }));

/* ================= синхронізація ================= */
let flushing = false, lastErr = '';
async function apiGet() {
  const r = await fetch(S.api + '?' + new URLSearchParams({ action: 'all', token: S.token }));
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Помилка сервера'); return j;
}
async function apiPost(body) {
  const r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token: S.token }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Помилка сервера'); return j;
}
async function refresh(silent) {
  if (!S.api || S.demo) { updSync(); return false; }
  try {
    const j = await apiGet();
    S.role = j.role; if (j.read_token) S.readToken = j.read_token; saveS();
    DB.program = j.program.map(normP).filter(Boolean);
    DB.log = mergeById(j.log.map(normL), Q.sets);
    DB.sessions = mergeById(j.sessions.map(normSess), Q.sessions);
    saveDB(); lastErr = '';
    const r = route()[0];
    if (!['ex', 'finish', 'settings'].includes(r)) render(true);
    updSync(); return true;
  } catch (e) { lastErr = e.message; if (!silent) toast('Не вдалося оновити: ' + e.message); updSync(); return false; }
}
async function flush() {
  if (flushing || !S.api || S.demo || coach() || !navigator.onLine) { updSync(); return; }
  const sets = Object.values(Q.sets), sessions = Object.values(Q.sessions);
  if (!sets.length && !sessions.length) { updSync(); return; }
  flushing = true; updSync();
  try {
    await apiPost({ action: 'save', sets, sessions });
    sets.forEach(s => { if (Q.sets[s.id] === s) delete Q.sets[s.id]; });
    sessions.forEach(s => { if (Q.sessions[s.id] === s) delete Q.sessions[s.id]; });
    saveQ(); lastErr = '';
  } catch (e) { lastErr = e.message; }
  flushing = false; updSync();
}
function updSync() {
  const el = $('#sync'), n = Object.keys(Q.sets).length + Object.keys(Q.sessions).length;
  let t = '✓ збережено', warn = false;
  if (S.demo) t = 'демо';
  else if (!S.api) { t = 'не підключено'; warn = true; }
  else if (coach()) t = 'перегляд';
  else if (!navigator.onLine) { t = `офлайн${n ? ' · ' + n : ''}`; warn = true; }
  else if (flushing) t = 'синхр…';
  else if (lastErr) { t = `помилка${n ? ' · ' + n : ''}`; warn = true; }
  else if (n) { t = `${n} в черзі`; warn = true; }
  el.textContent = t; el.className = warn ? 'warn' : '';
}
setInterval(flush, 30000);
addEventListener('online', () => { flush(); refresh(true); });
addEventListener('offline', updSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { flush(); refresh(true); } });

/* ================= дані програми ================= */
const P = () => DB.program;
const weeks = () => [...new Set(P().map(p => p.week))].sort((a, b) => a - b);
function daysOf(w) {
  const m = new Map();
  P().filter(p => p.week === w).forEach(p => { if (!m.has(p.day)) m.set(p.day, { week: w, day: p.day, date: p.date, items: [] }); m.get(p.day).items.push(p); });
  return [...m.values()].sort((a, b) => a.day - b.day).map(d => { d.items.sort((a, b) => a.order - b.order); return d; });
}
const dayOf = (w, d) => daysOf(w).find(x => x.day === d);
const setsOf = (w, d, o) => DB.log.filter(s => s.week === w && s.day_no === d && s.order === o).sort((a, b) => (b.is_warmup - a.is_warmup) || (a.set_no - b.set_no));
const workOf = (w, d, o) => setsOf(w, d, o).filter(s => !s.is_warmup);
const sessOf = (w, d) => DB.sessions.find(s => s.id === `w${w}-d${d}`);
function dayStatus(day) {
  const planned = day.items.reduce((a, p) => a + p.sets, 0);
  const done = day.items.reduce((a, p) => a + Math.min(p.sets, workOf(day.week, day.day, p.order).length), 0);
  const ss = sessOf(day.week, day.day);
  if ((ss && ss.finished_at) || (planned && done >= planned)) return 'done';
  return done ? 'progress' : 'todo';
}
function nextDay() {
  const all = weeks().flatMap(w => daysOf(w)).filter(d => dayStatus(d) !== 'done'), t = dkey(today());
  return all.find(d => dkey(d.date) >= t) || all.at(-1) || null;
}
const planStr = p => `${fw(p.w)} · ${p.sets}×${p.reps ?? '?'}${p.rest ? ' · відп. ' + p.rest : ''}`;
const fmtSet = s => `${s.weight_kg != null ? nf(s.weight_kg) + '×' : ''}${s.reps ?? '?'}${s.rir != null ? ' RIR' + rirTxt(s.rir) : ''}`;
function parseWarmup(t) {
  return String(t || '').split(/[,;]/).map(x => x.trim().match(/^(\d+(?:[.,]\d+)?)\s*[xх×*]\s*(\d+)$/i)).filter(Boolean).map(m => ({ w: num(m[1]), reps: +m[2] }));
}
function parseRest(t) {
  const s = String(t || '').toLowerCase(), m = s.match(/\d+(?:[.,]\d+)?/);
  if (!m) return 90;
  const n = num(m[0]);
  return /сек|sec|\bс\b/.test(s) ? Math.round(n) : Math.round(n * 60);
}
function lastTime(p) {
  const prev = DB.log.filter(s => s.exercise === p.name && !s.is_warmup && !(s.week === p.week && s.day_no === p.day));
  if (!prev.length) return '';
  const best = prev.reduce((a, s) => (dkey(s.date) + s.saved_at > dkey(a.date) + a.saved_at ? s : a));
  const same = prev.filter(s => s.week === best.week && s.day_no === best.day_no && s.order === best.order).sort((a, b) => a.set_no - b.set_no);
  return `${best.date.slice(0, 5)}: ${same.map(fmtSet).join(' · ')}`;
}

/* ================= запис ================= */
function putSession(x) {
  const i = DB.sessions.findIndex(s => s.id === x.id);
  if (i >= 0) DB.sessions[i] = x; else DB.sessions.push(x);
  if (!S.demo) Q.sessions[x.id] = x;
  saveDB(); saveQ(); flush();
}
// Тренування, записане заднім числом (дата в програмі вже минула), отримує дату з програми
function logDate(w, d) { const day = dayOf(w, d); return day && day.date && dkey(day.date) < dkey(today()) ? day.date : today(); }
function ensureSession(w, d) {
  if (sessOf(w, d)) return;
  putSession({ id: `w${w}-d${d}`, date: logDate(w, d), week: w, day_no: d, started_at: new Date().toISOString(), finished_at: '', wellbeing_1_5: null, comment: '' });
}
function putSet(s) {
  s.saved_at = new Date().toISOString();
  const i = DB.log.findIndex(x => x.id === s.id);
  if (i >= 0) DB.log[i] = s; else DB.log.push(s);
  if (!S.demo) Q.sets[s.id] = s;
  ensureSession(s.week, s.day_no);
  saveDB(); saveQ(); flush();
}
function delSet(id) {
  DB.log = DB.log.filter(x => x.id !== id);
  if (!S.demo) Q.sets[id] = { id, _delete: true };
  saveDB(); saveQ(); flush();
}

/* ================= таймер ================= */
const T = { end: 0, total: 0, iv: null, ac: null, label: '' };
function startTimer(sec, label) {
  T.total = sec; T.end = Date.now() + sec * 1000; T.label = label || 'Відпочинок';
  const el = $('#timer'); el.hidden = false; el.classList.remove('end');
  $('#timer small').textContent = T.label;
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.ceil((T.end - Date.now()) / 1000);
  $('#tleft').textContent = left > 0 ? `${Math.floor(left / 60)}:${pad(left % 60)}` : 'Час!';
  $('#bar').style.transform = `scaleX(${Math.max(0, left) / Math.max(1, T.total)})`;
  if (left <= 0) {
    clearInterval(T.iv); $('#timer').classList.add('end');
    try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
    beep();
    setTimeout(() => { if (Date.now() >= T.end) $('#timer').hidden = true; }, 8000);
  }
}
function beep() {
  try {
    const ac = T.ac; if (!ac) return;

  const side = Math.round((total - bar) / 2 * 100) / 100;
  if (side < 0) return { under: true, side };
  let rem = Math.round(side * 100); const plates = [];
  S.plates.slice().sort((a, b) => b - a).forEach(x => { const c = Math.round(x * 100); while (c > 0 && rem >= c) { plates.push(x); rem -= c; } });
  return { side, plates, rem: rem / 100 };
}
function updPlates(rows, bar) {
  let prevSide = null;
  rows.forEach(row => {
    const el = row.querySelector('.pl'); if (!el) return;
    const r = platesFor(num(row.querySelector('.w').value), bar);
    if (!r) { el.innerHTML = ''; return; }
    let h;
    if (r.under) h = `<span>легше за гриф ${nf(bar)} кг</span>`;
    else if (!r.plates.length && !r.rem) h = `<span>тільки гриф ${nf(bar)} кг</span>`;
    else h = `<span>на кожен бік:</span>${r.plates.map(x => `<span class="plate">${nf(x)}</span>`).join('')}${r.rem ? `<span>+ ще ${nf(r.rem)} (немає млинця)</span>` : ''}`;
    if (!r.under && prevSide != null && Math.abs(r.side - prevSide) > 0.001) {
      const dlt = r.side - prevSide;
      h += `<span class="pd${dlt < 0 ? ' dn' : ''}">${dlt > 0 ? '+' : '−'}${nf(Math.abs(dlt))} з боку</span>`;
    }
    el.innerHTML = h;
    if (!r.under) prevSide = r.side;
  });
}

// «Техніка… Тренер: коментар» → [техніка, коментар тренера]
function splitNotes(t) {
  const s = String(t || ''), i = s.search(/тренер\s*:/i);
  if (i < 0) return [s.trim(), ''];
  return [s.slice(0, i).trim(), s.slice(i).replace(/^тренер\s*:\s*/i, '').trim()];
}

function rowsFor(p) {
  const k = `${p.week}-${p.day}-${p.order}`, ex = extra[k] || (extra[k] = { work: 0, wu: 0 });
  const saved = setsOf(p.week, p.day, p.order), wuS = saved.filter(s => s.is_warmup), wkS = saved.filter(s => !s.is_warmup);
  const plan = parseWarmup(p.warmup);
  const maxWu = Math.max(plan.length + ex.wu, wuS.reduce((a, s) => Math.max(a, s.set_no), 0));
  const maxWk = Math.max(p.sets + ex.work, wkS.reduce((a, s) => Math.max(a, s.set_no), 0));
  const base = `w${p.week}-d${p.day}-o${p.order}`, rows = [], vids = videoSets(p);
  for (let n = 1; n <= maxWu; n++) {
    const sv = wuS.find(s => s.set_no === n), pl = plan[n - 1];
    rows.push({ id: `${base}-wu${n}`, o: p.order, n, wu: 1, saved: sv, pre: sv || { weight_kg: pl ? pl.w : null, reps: pl ? pl.reps : null, rir: null }, del: n > plan.length || !!sv });
  }
  let prev = null;
  for (let n = 1; n <= maxWk; n++) {
    const sv = wkS.find(s => s.set_no === n);
    rows.push({ id: `${base}-s${n}`, o: p.order, n, wu: 0, vid: vids.has(n), saved: sv, pre: sv || { weight_kg: prev ? prev.weight_kg : p.w, reps: prev ? prev.reps : p.reps, rir: null }, del: n > p.sets });
    if (sv) prev = sv;
  }
  const lastWork = rows.filter(r => !r.wu).at(-1); if (lastWork) lastWork.last = true;
  return rows;
}
function rowHTML(r, lab) {

    ${sx}${vt}<div class="sl">${r.wu ? 'Р' + r.n : r.n}</div>

// Вправи одного суперсету, що йдуть підряд
function groupOf(day, p) {
  if (!p.ss) return [p];
  const it = day.items, i = it.indexOf(p); let a = i, b = i;
  while (a > 0 && it[a - 1].ss === p.ss) a--;
  while (b < it.length - 1 && it[b + 1].ss === p.ss) b++;
  return it.slice(a, b + 1);
}

function viewEx(w, d, o) {
  const day = dayOf(w, d), p = day && day.items.find(x => x.order === o); if (!p) throw new Error('no ex');
  const G = groupOf(day, p), multi = G.length > 1;
  setTitle(multi ? `Суперсет ${p.ss}` : p.name);
  const prevP = day.items[day.items.indexOf(G[0]) - 1], nextP = day.items[day.items.indexOf(G.at(-1)) + 1];

    return `<div class="card"${multi ? ` style="border-left:3px solid ${col(m)}"` : ''}>

  html += G.map(card).join('');

      const saved = setsOf(w, d, m.order), c = noteOf(m);
      return saved.length ? `<div class="card">${multi ? `<div class="sxl" style="color:${col(m)}">${esc(tagOf(m))} · ${esc(shortName(m.name))}</div>` : ''}<table class="ro"><tr><th>Підхід</th><th>Вага</th><th>Повт.</th><th>RIR</th></tr>${saved.map(s => `<tr><td>${s.is_warmup ? 'Розм. ' + s.set_no : s.set_no}</td><td>${s.weight_kg != null ? nf(s.weight_kg) : '—'}</td><td>${s.reps ?? '—'}</td><td>${rirTxt(s.rir) || '—'}</td></tr>`).join('')}</table>${c ? `<p class="muted">${esc(c)}</p>` : ''}</div>`
        : `<div class="card muted">${multi ? esc(shortName(m.name)) + ': ' : ''}ще не виконано</div>`;

    html += `<div id="sets"></div>

  }
  html += `<div class="navx" style="margin-top:14px">${prevP ? `<a class="btn ghost" href="#/ex/${w}/${d}/${prevP.order}">‹ ${esc(shortName(prevP.ss ? 'Суперсет ' + prevP.ss : prevP.name).slice(0, 16))}</a>` : ''}
    ${nextP ? `<a class="btn ghost" href="#/ex/${w}/${d}/${nextP.order}">${esc(shortName(nextP.ss ? 'Суперсет ' + nextP.ss : nextP.name).slice(0, 16))} ›</a>` : `<a class="btn" href="#/finish/${w}/${d}">Завершити ›</a>`}</div>`;
  const app = $('#app');
  app.innerHTML = html;
  if (coach()) return;
  requestWake();

  const box = $('#sets');
  const memberOf = row => G.find(m => m.order === +row.dataset.o);
  const updAll = () => G.forEach(m => updPlates(box.querySelectorAll(`.set[data-o="${m.order}"]`), barOf(m)));
  const draw = () => {
    const R = G.map(m => ({ m, rows: rowsFor(m) }));

  $('#addSet').onclick = () => {

    draw();
  };
  app.querySelectorAll('[data-addwu]').forEach(b => b.onclick = () => {
    const m = G.find(x => x.order === +b.dataset.addwu), ex = extra[`${w}-${d}-${m.order}`], pl = parseWarmup(m.warmup).length;
    const mx = Math.max(pl + ex.wu, setsOf(w, d, m.order).filter(s => s.is_warmup).reduce((a, s) => Math.max(a, s.set_no), 0)); ex.wu = mx - pl + 1; draw();
  });

  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const row = b.closest('.set'), a = b.dataset.a, m = memberOf(row);

    if (a === 'w-' || a === 'w+') {
      const cur = num(wi.value) ?? m.w ?? 0, st = +S.step || 2.5;

      const id = row.dataset.id, old = DB.log.find(s => s.id === id), n = +row.dataset.n;
      putSet({ id, saved_at: '', week: w, date: old ? old.date : logDate(w, d), day_no: d, order: m.order, exercise: m.name, set_no: n,

}

function report(w, d) {
  const day = dayOf(w, d), ss = sessOf(w, d) || {};
  const L = [`Тренування ${tNo(w, d)} · ${day.date.slice(0, 5)} · Тиждень ${w}`];
  if (ss.date && ss.date !== day.date) L.push(`Виконано: ${ss.date}`);
  L.push('');
  day.items.forEach((p, i) => {
    const wk = workOf(w, d, p.order), last = wk.reduce((a, s) => (!a || s.set_no > a.set_no ? s : a), null);
    L.push(`${i + 1}. ${shortName(p.name)} — ${!last ? 'не виконано' : last.rir != null ? 'RIR ' + rirTxt(last.rir) : 'RIR —'}`);
  });
  if (ss.wellbeing_1_5 || ss.comment) L.push('');
  if (ss.wellbeing_1_5) L.push(`Самопочуття: ${ss.wellbeing_1_5}/5`);
  if (ss.comment) L.push(`Коментар: ${ss.comment}`);
  return L.join('\n').trim();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Скопійовано'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Скопійовано'); } catch (er) { toast('Не вдалося скопіювати'); } ta.remove(); }
}
async function shareText(t) {
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copyText(t);
}

function viewFinish(w, d) {
  const day = dayOf(w, d); if (!day) throw new Error('no day');
  setTitle(`Звіт · Тренування ${tNo(w, d)}`);
  const ss = sessOf(w, d) || {};
  let html = '';
  if (!coach()) {
    html += `<div class="card"><label style="margin-top:0">Самопочуття</label><div class="wb">${[1, 2, 3, 4, 5].map(x => `<button data-wb="${x}" class="${ss.wellbeing_1_5 === x ? 'on' : ''}">${x}</button>`).join('')}</div>
      <label for="scmt">Коментар до тренування</label><textarea id="scmt" placeholder="Сон, енергія, біль, що було важко…">${esc(ss.comment || '')}</textarea>
      <button class="btn" id="fin">${ss.finished_at ? 'Оновити звіт' : 'Завершити тренування'}</button></div>`;
  }
  html += `<div class="card"><b>Звіт тренеру</b><pre class="rep" id="rep"></pre>
    <button class="btn" id="share">Поділитися (Telegram, Viber…)</button><button class="btn ghost" id="copy">Копіювати текст</button></div>`;
  $('#app').innerHTML = html;
  const upd = () => { $('#rep').textContent = report(w, d); };

  if (coach()) return;
  let wb = ss.wellbeing_1_5 || null;
  document.querySelectorAll('.wb button').forEach(b => b.onclick = () => { wb = +b.dataset.wb; document.querySelectorAll('.wb button').forEach(x => x.classList.toggle('on', x === b)); });

    upd(); $('#fin').textContent = 'Оновити звіт'; toast('Тренування збережено');

/* ================= прогрес ================= */

// М'язи, на які працює вправа (1 = основний, 0.5 = допоміжний) і загальна група

    const pc = list.map(x => x.pr ? gold : acc), rad = list.map(x => x.pr ? 7 : 4);
    if (useW) mkChart($('#c1'), labels, [{ label: 'Вага', data: list.map(x => x.maxW), color: acc, pointColors: pc, radii: rad }, { label: 'Оцінка 1ПМ', data: list.map(x => x.e1rm && f1(x.e1rm)), color: ok, dash: [5, 4], radii: 0 }], { unit: ' кг' });
    else mkChart($('#c1'), labels, [{ label: 'Повтори', data: list.map(x => x.repsAtMax), color: acc, pointColors: pc, radii: rad }]);
    mkChart($('#c3'), labels, [{ label: 'RIR', data: list.map(x => x.lastRir), color: gold }], { min: 0, max: 5, step: 1 });
  });
}

/* ================= вкладка «Тіло» ================= */
let bodyWeek = null;
function viewBody() {
  setTitle('Тіло');
  const app = $('#app'), ws = weeks();
  if (!ws.length) { app.innerHTML = '<div class="card muted">Тут з’явиться, на які м’язи працює програма, щойно буде програма тренера.</div>'; return; }
  const nd = nextDay(), defW = nd ? nd.week : ws.at(-1);
  if (!ws.includes(bodyWeek)) bodyWeek = defW;
  const w = bodyWeek, days = daysOf(w);
  let { mus, grp } = muscleLoad(w), planned = false;
  if (!Object.keys(grp).length) { // ще не тренувалась — показуємо за планом
    planned = true; mus = {}; grp = {};
    days.forEach(d => d.items.forEach(p => { const [g, m] = exInfo(p.name); grp[g] = (grp[g] || 0) + p.sets; Object.entries(m).forEach(([k, f]) => { mus[k] = (mus[k] || 0) + f * p.sets; }); }));
  }
  const totG = Object.values(grp).reduce((a, b) => a + b, 0) || 1;
  const wkThemes = dayThemes({ items: days.flatMap(d => d.items) }, 4);
  app.innerHTML = `
    <div class="wsel">${ws.map(x => `<button data-w="${x}" class="${x === w ? 'on' : ''}">Тиждень ${x}</button>`).join('')}</div>
    <h3 class="sec">Цей тиждень працює на</h3>
    <div class="mot">${wkThemes.map((t, i) => `<div class="mi"><span class="md" style="background:${GC[i]}"></span><div><b>${esc(t.t)}</b><span>${esc(t.s)}</span></div></div>`).join('')}</div>
    <h3 class="sec">Що працює${planned ? ' · за планом' : ''}</h3>
    <div class="card">${bodySVG(mus)}
      ${GROUPS.filter(([g]) => grp[g]).map(([g, l]) => `<div class="gbar"><span>${l}${GROUP_WHY[g] ? `<small>${GROUP_WHY[g]}</small>` : ''}</span><i><b style="width:${Math.round(grp[g] / totG * 100)}%"></b></i><span>${Math.round(grp[g] / totG * 100)}%</span></div>`).join('')}
      <p class="muted" style="margin:10px 0 0">Яскравіше — більше підходів на м'яз за тиждень.</p></div>
    <h3 class="sec">По тренуваннях</h3>
    ${days.map(d => `<a class="card bday" href="#/day/${d.week}/${d.day}"><div class="bdh"><b>№${tNo(d.week, d.day)}</b><span class="muted">${DOW[parseD(d.date).getDay()]} ${esc(d.date.slice(0, 5))}</span></div>
      <div class="chips">${dayThemes(d).map(t => `<span>${esc(t.t)}</span>`).join('')}</div></a>`).join('')}`;
  app.querySelectorAll('.wsel button').forEach(b => b.onclick = () => { bodyWeek = +b.dataset.w; render(true); });
}

function viewSettings() {
  setTitle('Налаштування');
  const base = location.origin + location.pathname;
  const coachLink = S.api && S.readToken ? `${base}?api=${encodeURIComponent(S.api)}&token=${encodeURIComponent(S.readToken)}&coach=1` : '';
  const myLink = S.api && S.token && !coach() ? `${base}?api=${encodeURIComponent(S.api)}&token=${encodeURIComponent(S.token)}` : '';
  $('#app').innerHTML = `<div class="card"><b>Підключення до Google Таблиці</b>
    <label for="api">URL веб-застосунку Apps Script</label><input class="f" id="api" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.api)}">
    <label for="tok">Токен (WRITE_TOKEN з аркуша «Налаштування»)</label><input class="f" id="tok" value="${esc(S.token)}">
    <button class="btn" id="conn">Зберегти і завантажити програму</button>
    ${S.api ? '<button class="btn ghost" id="ref">Оновити програму з таблиці</button>' : ''}</div>
    ${!coach() ? `<div class="card"><b>Тренування</b><label for="step">Крок зміни ваги, кг</label><select id="step">${[0.5, 1, 1.25, 2, 2.5, 5].map(x => `<option ${+S.step === x ? 'selected' : ''} value="${x}">${nf(x)}</option>`).join('')}</select>
      <label for="fno">Номер першого тренування в програмі</label><input class="f" id="fno" type="number" inputmode="numeric" min="1" value="${firstNo()}">
      <div class="muted" style="margin-top:6px">Тиждень 1, тренування 1 (${esc((allDays()[0] || {}).date || '—')}) = №${firstNo()}. Далі нумерація продовжується сама.</div>
      <label>Млинці в залі, кг</label><div class="plch" id="plch">${[25, 20, 15, 10, 5, 2.5, 1.25, 0.5].map(x => `<button data-p="${x}" class="${S.plates.includes(x) ? 'on' : ''}">${nf(x)}</button>`).join('')}</div>
      <div class="muted" style="margin-top:8px">Гриф обираєш на екрані вправи — він запам'ятовується для кожної вправи окремо.</div></div>` : ''}
    ${coachLink ? `<div class="card"><b>Посилання для тренера</b><div class="muted">Тільки перегляд програми, підходів, RIR і звітів.</div><button class="btn" id="cl">Копіювати посилання</button></div>` : ''}
    ${myLink ? `<div class="card"><b>Відкрити на іншому пристрої</b><div class="muted">Посилання з повним доступом — не пересилай його іншим.</div><button class="btn ghost" id="ml">Копіювати своє посилання</button></div>` : ''}
    <div class="card"><b>Дані</b><div class="muted">${S.demo ? 'Зараз демо-режим: записи зберігаються лише на цьому пристрої.' : `Записів підходів: ${DB.log.length}`}</div>
    ${!S.demo ? '<button class="btn ghost" id="demo">Спробувати демо</button>' : ''}<button class="btn ghost" id="reset">Очистити дані на пристрої</button></div>`;
  $('#conn').onclick = async () => {
    const api = $('#api').value.trim(), tok = $('#tok').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(api)) { toast('Встав URL виду https://script.google.com/macros/s/…/exec'); return; }
    if (S.demo) { DB = { program: [], log: [], sessions: [] }; Q = { sets: {}, sessions: {} }; saveDB(); saveQ(); }
    S.api = api; S.token = tok; S.demo = false; S.role = 'write'; saveS();
    toast('Завантажую…');
    if (await refresh()) { toast(coach() ? 'Підключено (режим перегляду)' : 'Підключено'); flush(); location.hash = '#/'; }
  };
  const rf = $('#ref'); if (rf) rf.onclick = async () => { await flush(); if (await refresh()) toast('Програму оновлено'); };
  const sp = $('#step'); if (sp) sp.onchange = () => { S.step = +sp.value; saveS(); };
  const fn = $('#fno'); if (fn) fn.onchange = () => { const v = parseInt(fn.value, 10); if (v > 0) { S.firstNo = v; saveS(); toast(`Перше тренування — №${v}`); render(true); } };
  const pc = $('#plch'); if (pc) pc.onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const x = +b.dataset.p;
    if (S.plates.includes(x)) { if (S.plates.length === 1) return; S.plates = S.plates.filter(y => y !== x); } else S.plates = [...S.plates, x];
    saveS(); b.classList.toggle('on', S.plates.includes(x));
  };
  const cl = $('#cl'); if (cl) cl.onclick = () => copyText(coachLink);
  const ml = $('#ml'); if (ml) ml.onclick = () => copyText(myLink);
  const dm = $('#demo'); if (dm) dm.onclick = () => { if (DB.log.length && !confirm('Демо замінить дані на цьому пристрої (у таблиці нічого не зміниться). Продовжити?')) return; loadDemo(); };
  $('#reset').onclick = () => {
    const n = Object.keys(Q.sets).length + Object.keys(Q.sessions).length;
    if (!confirm(n ? `Є ${n} несинхронізованих записів — вони пропадуть. Очистити?` : 'Очистити локальні дані? Дані в таблиці залишаться.')) return;
    DB = { program: [], log: [], sessions: [] }; Q = { sets: {}, sessions: {} }; S = { api: '', token: '', step: S.step, demo: false, role: 'write', readToken: '', bars: S.bars, plates: S.plates };
    saveDB(); saveQ(); saveS(); location.hash = '#/'; render();
  };
}
function loadDemo() {
  DB = { program: DEMO.map(r => normP(Object.fromEntries(PH.map((k, i) => [k, r[i]])))).filter(Boolean), log: [], sessions: [] };
  Q = { sets: {}, sessions: {} };
  S.demo = true; S.role = 'write'; S.api = ''; S.token = ''; saveS(); saveDB(); saveQ();
  location.hash = '#/'; render(); toast('Демо-програму завантажено');
}

/* ================= старт ================= */
render();
flush(); refresh(true);
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}); }
</script>
</body>
